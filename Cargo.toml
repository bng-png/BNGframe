[workspace]
resolver = "2"
members = [
    "crates/bngframe-core",
    "crates/bngframe-capture",
    "crates/bngframe-overlay",
    "crates/bngframe-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BNGframe contributors"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
image = "0.25"
notify = "8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
xz2 = "0.1"
walkdir = "2"
bngframe-core = { path = "crates/bngframe-core" }
bngframe-capture = { path = "crates/bngframe-capture" }
bngframe-overlay = { path = "crates/bngframe-overlay" }
